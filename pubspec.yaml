name: solar_security
description: Solar-powered security system mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.12.0
  provider: ^6.1.0
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.3.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  go_router: ^14.0.0
  flex_color_scheme: ^8.4.0
  google_fonts: ^8.0.2
  amazon_cognito_identity_dart_2: ^3.8.1
  path_drawing: ^1.0.1
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/icon.png"
  macos:
    generate: true
    image_path: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
  image_path: "assets/icon.png"
  remove_alpha_ios: true
